allowBuilds:
  '@firebase/util': true
  # electron-builder includes this Squirrel helper, unused by the portable target.
  electron-winstaller: false
  esbuild: true
  protobufjs: true
minimumReleaseAgeExclude:
  - '@playwright/test@1.64.1'
  - playwright-core@1.64.1
  - playwright@1.64.1
nodeLinker: hoisted
