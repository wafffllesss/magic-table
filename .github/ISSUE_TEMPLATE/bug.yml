name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce and expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: App version, OS and browser (if applicable)
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Logs or screenshots (remove private information)
